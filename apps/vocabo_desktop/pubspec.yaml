name: vocabo_desktop
description: Vocabo desktop app for macOS
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.3

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  just_audio: ^0.9.43
  path_provider: ^2.1.0
  tray_manager: ^0.2.3
  window_manager: ^0.4.3
  vocabo_core:
    path: ../../packages/vocabo_core
  vocabo_api:
    path: ../../packages/vocabo_api
  vocabo_ui:
    path: ../../packages/vocabo_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
